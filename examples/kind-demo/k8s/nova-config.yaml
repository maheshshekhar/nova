# ── Nova runtime config (mounted into the dashboard) ──────────────────────────
# Provides a nova.config.yaml so Nova reads logs from EVERY namespace instead of
# the built-in `production`-only default. Only the log scope is overridden here;
# every other section falls back to its schema default (zod deep-fills partial
# configs). The dashboard mounts this at /config/nova.config.yaml and points
# $NOVA_CONFIG at it (see dashboard.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-config
  namespace: nova-monitoring
  labels:
    app: dashboard
data:
  nova.config.yaml: |
    logs:
      provider: loki
      url: ${LOKI_URL:-http://loki:3100}
      # Watch all namespaces: `namespace=~".+"` matches every stream Fluent Bit
      # ships. The load-generator remains excluded as pure synthetic noise.
      scope:
        include:
          - { namespace: { regex: ".+" } }
        exclude:
          - { service: load-generator }
    # Start with a REAL, empty incident store — no seeded demo history. Incidents
    # appear only when they actually happen (inject scripts / alert webhooks).
    persistence:
      provider: file
      seed: none
    # ── Metrics: WHERE Nova reads service metrics from ──────────────────
    # This is the ONLY place that configures Nova's metrics. Pick one provider:
    #
    #  1) kubernetes (default) — Nova reads pod/workload health (CPU / memory /
    #     pod status / deployments) from the Kubernetes API for EVERY workload,
    #     zero config. (Today via the bundled collector at `url`; a built-in
    #     informer reader replaces it soon. `http` is a legacy alias.)
    #  2) prometheus — OPTIONAL: add REAL app metrics (error rate / latency / RPS)
    #     from a workload's OWN Prometheus. You declare the queries (or let the
    #     Signals tab at /settings generate them), so you always know exactly what
    #     data drives the dashboard.
    #
    # Example: point at the OTel demo's Prometheus (deploy-reference-apps.sh → 1),
    # which is exposed at prometheus.otel-demo:9090 — replace the two lines below:
    #   metrics:
    #     provider: prometheus
    #     url: http://prometheus.otel-demo:9090
    #     serviceLabel: job
    metrics:
      provider: kubernetes
      url: ${METRICS_COLLECTOR_URL:-http://metrics-collector:3001}
