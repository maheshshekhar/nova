---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: nova-monitoring

# NOTE: The production-namespace Role + RoleBinding that let the dashboard
# inject/remediate the payment workloads live with those workloads, in
# examples/custom-payment-system.yaml — so the monitoring platform stays free of
# any payment-specific coupling.

---
# Read-only cluster inventory for Nova's IN-PROCESS metrics reader (the native
# replacement for the external metrics-collector sidecar): pods, namespaces,
# deployments + metrics-server. Strictly read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-metrics-reader
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: nova-monitoring

