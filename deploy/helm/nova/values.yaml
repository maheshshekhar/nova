# Default values for the Nova Helm chart.
# See the README "Deploy to Kubernetes (Helm)" section for the full guide.

replicaCount: 1

image:
  repository: ghcr.io/your-org/nova
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── RBAC for the in-process metrics reader (default metrics.provider: kubernetes) ──
# Creates a ServiceAccount + read-only ClusterRole (pods, namespaces, deployments,
# metrics.k8s.io) so the dashboard can read cluster inventory directly — no external
# metrics-collector sidecar. Set false if you use metrics.provider: prometheus/http/none.
rbac:
  create: true

# ── Nova configuration (rendered to a ConfigMap → mounted at /app/nova.config.yaml) ──
# This is the entire nova.config.yaml. Secrets stay OUT of here — reference them
# with ${ENV_VAR} and provide the value via `secret` below. See nova.config.example.yaml.
novaConfig:
  logs:
    provider: loki # loki | elasticsearch | opensearch
    url: ${LOKI_URL:-http://loki:3100}
    scope:
      include:
        - { namespace: production }
      exclude:
        - { service: load-generator }
  persistence:
    provider: file
    seed: none # 'none' for a real deployment; 'demo' seeds the bundled sample history
    dataDir: /data
  ai:
    provider: openrouter
    apiKeyEnv: OPENROUTER_API_KEY
  # domain: /app/domains/generic-k8s.yaml   # optional Domain Pack
  features:
    chat: true
    eval: true
    autoRemediation: false

# ── Secrets (AI keys, backend credentials) — kept in a Kubernetes Secret ──
# Option A (recommended): reference an existing Secret you manage out-of-band.
#   secret.existingSecret: my-nova-secrets
# Option B: let the chart create the Secret from the values below (avoid committing real keys).
secret:
  existingSecret: ""
  create: true
  data:
    OPENROUTER_API_KEY: ""
    # ANTHROPIC_API_KEY: ""
    # LOKI_URL: "http://loki.observability:3100"

# Extra plain (non-secret) environment variables.
extraEnv: []
#  - name: NODE_ENV
#    value: production

# ── Nova Sentinel (zero-instrumentation early-detection companion) ──
# A separate read-only Deployment that watches Kubernetes Pods + Events and opens
# evidenced incidents in Nova (via /api/alerts) before Prometheus alerts fire.
# Disabled by default; enable it once you have built + pushed the sentinel image
# (see deploy/sentinel/Dockerfile).
sentinel:
  enabled: false
  image:
    repository: ghcr.io/your-org/nova-sentinel
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Base URL of the Nova dashboard. Defaults to the in-cluster Service.
  novaUrl: ""
  # Namespaces to watch. Empty = all namespaces (needs the cluster-wide RBAC below).
  namespaces: []
  # Start in dry-run to observe what Sentinel WOULD open without creating incidents.
  dryRun: false
  windowMs: 600000 # correlation window (10 min)
  softConfirmKinds: 2 # distinct soft signal kinds required to confirm
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Persistence (the file store lives here; use a real backend to avoid a PVC) ──
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 3000
  # For service.type: NodePort, optionally pin the node port (30000–32767). The
  # kind demo uses this so its containerPort:30000→hostPort:3000 mapping serves the
  # dashboard at localhost:3000 with no port-forward. Leave unset for a random port.
  # nodePort: 30000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: nova.example.com
  tls: false
  tlsSecretName: nova-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Nova runs as a non-root user (uid 1001) that must write to /data.
podSecurityContext:
  fsGroup: 1001
securityContext:
  runAsNonRoot: true
  runAsUser: 1001

nodeSelector: {}
tolerations: []
affinity: {}
